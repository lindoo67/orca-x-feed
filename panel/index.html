<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X Feed</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </div>
        <h1 class="title">X Feed</h1>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </header>

      <div class="lookup">
        <input
          id="lookup-input"
          type="text"
          placeholder="推文链接 / 推文 ID / @用户名"
          spellcheck="false"
          autocomplete="off"
        />
        <button id="lookup-go" class="go">查询</button>
        <button id="lookup-clear" class="ghost" title="清空">×</button>
      </div>

      <div class="scroll">
        <section id="result" class="result">
          <p class="hint">
            粘贴一条 x.com 链接，或输入 <code>@用户名</code> / 纯数字推文 ID，回车即可。<br />
            只能查单条推文和单个用户 —— X 的时间线、搜索与热门没有公开接口。
          </p>
        </section>

        <section class="saved-wrap">
          <h2 class="sect">收藏 <span class="pill" id="saved-count"></span></h2>
          <div id="saved"><p class="none">还没有收藏。</p></div>
        </section>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
